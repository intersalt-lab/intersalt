<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INTERSALT - Registro de Instalación</title>
    <style>
        :root {
            --primario: #007bff; 
            --oscuro: #121212;
            --gris-claro: #f8f9fa;
            --verde: #25d366;
        }
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 0; line-height: 1.6; color: #333; background-color: var(--gris-claro); }
        
        header { background: var(--oscuro); color: white; padding: 1.5rem 5%; text-align: center; border-bottom: 4px solid var(--primario); }
        .logo { font-size: 2rem; font-weight: 800; letter-spacing: 2px; }
        .logo span { color: var(--primario); }
        
        .container { max-width: 600px; margin: 30px auto; padding: 20px; }
        
        .formulario-card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .formulario-card h2 { text-align: center; color: var(--oscuro); margin-bottom: 25px; border-bottom: 2px solid var(--primario); padding-bottom: 10px; }
        
        .campo { margin-bottom: 20px; }
        .campo label { display: block; font-weight: bold; margin-bottom: 8px; color: #555; }
        .campo input, .campo select { width: 100%; padding: 14px; border: 1px solid #ddd; border-radius: 10px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        .campo input:focus { border-color: var(--primario); outline: none; box-shadow: 0 0 8px rgba(0,123,255,0.2); }
        
        .btn-enviar { background: var(--verde); color: white; border: none; width: 100%; padding: 18px; border-radius: 10px; font-weight: bold; font-size: 1.2rem; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3); }
        .btn-enviar:hover { background: #1ebd5b; transform: translateY(-2px); }

        .info-pago { background: #fff3cd; color: #856404; padding: 15px; border-radius: 10px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        
        footer { text-align: center; padding: 30px; color: #888; font-size: 0.9rem; }
    </style>
</head>
<body>

<header>
    <div class="logo">INTER<span>SALT</span></div>
</header>

<div class="container">
    <div class="info-pago">
        📍 Pichanal, Salta <br>
        Costo de Instalación: $149.000
    </div>

    <div class="formulario-card">
        <h2>📝 Solicitud de Servicio</h2>
        <form id="formRegistro">
            <div class="campo">
                <label>Nombre y Apellido:</label>
                <input type="text" id="nombre" placeholder="Nombre completo" required>
            </div>

            <div class="campo">
                <label>DNI:</label>
                <input type="number" id="dni" placeholder="Sin puntos" required>
            </div>

            <div class="campo">
                <label>Teléfono de Contacto:</label>
                <input type="tel" id="tel_alternativo" placeholder="Ej: 3878XXXXXX" required>
            </div>

            <div class="campo">
                <label>Dirección / Barrio / Manzana:</label>
                <input type="text" id="direccion" placeholder="Ej: B° Centro, Calle Falsa 123" required>
            </div>

            <div class="campo">
                <label>Plan Elegido:</label>
                <select id="plan">
                    <option value="Plan Inicial 50MB ($31.900)">Plan Inicial 50 MB - $31.900/mes</option>
                    <option value="Plan Familiar 100MB ($38.000)">Plan Familiar 100 MB - $38.000/mes</option>
                    <option value="Plan Empresas 300MB ($56.000)">Plan Empresas 300 MB - $56.000/mes</option>
                </select>
            </div>

            <button type="button" class="btn-enviar" onclick="enviarRegistro()">ENVIAR POR WHATSAPP</button>
        </form>
    </div>
</div>

<footer>
    <strong>INTERSALT ISP</strong><br>
    Pichanal, Salta | Conectando el futuro.
</footer>

<script>
    function enviarRegistro() {
        const nombre = document.getElementById('nombre').value;
        const dni = document.getElementById('dni').value;
        const tel = document.getElementById('tel_alternativo').value;
        const direccion = document.getElementById('direccion').value;
        const plan = document.getElementById('plan').value;
        const mi_ws = "5493878351649"; 

        if(!nombre || !dni || !tel || !direccion) {
            alert("Por favor, completá todos los campos para continuar.");
            return;
        }

        const mensaje = `*SOLICITUD DE INSTALACIÓN - INTERSALT*%0A` +
                        `--------------------------------%0A` +
                        `👤 *Nombre:* ${nombre}%0A` +
                        `🆔 *DNI:* ${dni}%0A` +
                        `📞 *Teléfono:* ${tel}%0A` +
                        `📍 *Dirección:* ${direccion}%0A` +
                        `🌐 *Plan:* ${plan}%0A` +
                        `--------------------------------%0A` +
                        `_Enviado desde la web oficial de InterSalt_`;
        
        const url = `https://wa.me/${mi_ws}?text=${mensaje}`;
        window.open(url, '_blank');
    }
</script>

</body>
</html>
